<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Try a Hoet frame on, right in your browser." />
    <meta name="keywords" content="Hoet, Eyewear Mirror" />
    <!-- Wat er te zien is als iemand deze link deelt. Deze pagina bestaat om doorgestuurd
         te worden ("probeer deze bril eens"), en zonder deze regels is dat een grijze
         rechthoek met een domeinnaam eronder. Het adres van het plaatje moet absoluut zijn:
         de meeste scrapers weigeren een relatief pad, ook al werkt het in de browser. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hoet-eyewear-mirror.com/" />
    <meta property="og:title" content="Hoet Eyewear Mirror" />
    <meta property="og:description" content="Try a Hoet frame on, right in your browser." />
    <meta property="og:image" content="https://hoet-eyewear-mirror.com/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hoet Eyewear Mirror</title>
    <!-- De pas-app staat op een ander domein, en de browser begint daar pas aan te bouwen
         zodra hij het iframe onderaan tegenkomt: DNS, TLS en verbinding vallen dan achter
         het parsen van deze pagina. Vooraf verbinden haalt dat naar voren. -->
    <link rel="preconnect" href="https://hoet.owiz.fittingbox.com" crossorigin>
    <link rel="dns-prefetch" href="https://hoet.owiz.fittingbox.com">
    <!-- Deze pagina is overal met een tracking-staart achter het adres te bereiken
         ("?utm_source=..."), en elk van die adressen is voor een zoekmachine een aparte
         pagina met dezelfde inhoud. Deze regel wijst er één aan als het echte. -->
    <link rel="canonical" href="https://hoet-eyewear-mirror.com/">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            box-sizing: border-box;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #000;
            color: #FFF;
        }
        .row {
            max-width: 1300px;
            margin: 0 auto;
        }
        .col {
            padding: 0 1em;
        }
        .header__inner {
            display: flex;
            align-items: flex-end;
            padding: 1em 0;
        }
        /* Het logo is het enige eigen beeld op deze pagina en dus wat de meting als
           grootste element ziet. Als achtergrondafbeelding werd het pas aangevraagd nadat
           de stijl was gelezen en de doos berekend; als img-element in de opmaak ziet de browser
           het meteen bij het parsen staan. Zelfde doos, zelfde uitsnede: object-fit doet
           hier wat background-size: contain deed. */
        .header__logo {
            display: block;
            width: 200px;
            aspect-ratio: 5 / 3;
            object-fit: contain;
            object-position: center center;
        }
        /* Weggeschoven in plaats van display:none of visibility:hidden: wat niet getekend
           wordt, wordt door een schermlezer ook niet voorgelezen, en dan lost de kop het
           probleem niet op dat hij moest oplossen. */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }
        iframe {
            display: block;
            border: 0;
            width: 100%;
            height: calc(100vh - 152px);
        }
        @media only screen and (max-width: 767px) {
            .header__logo {
                width: 100px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header">
            <div class="row">
                <div class="col">
                    <div class="header__inner">
                        <picture>
                            <source srcset="logo-white.webp" type="image/webp">
                            <img class="header__logo" src="logo-white.png" alt="Hoet"
                                 width="200" height="120" fetchpriority="high">
                        </picture>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- De pagina had geen enkele kop. Wie hem met een schermlezer opent hoort daardoor
         "Hoet" (het logo) en daarna andermans app in een frame, en nooit waar hij is
         beland. Zichtbaar staat het er wel al, in het logo en in de app zelf, dus deze
         kop wordt weggeschoven in plaats van getekend. -->
    <h1 class="visually-hidden">Hoet Eyewear Mirror</h1>
    <iframe id="mirror" data-src="https://hoet.owiz.fittingbox.com" title="Hoet Eyewear Mirror"
            allow="microphone; camera"></iframe>
    <noscript>
        <iframe src="https://hoet.owiz.fittingbox.com" title="Hoet Eyewear Mirror"
                allow="microphone; camera"></iframe>
    </noscript>
    <!-- Los bestand en niet inline, omdat de kopregel Content-Security-Policy inline
         javascript weigert. Dat kon ook met een hash van deze regels in _headers, maar dan
         breekt de pas-app zodra iemand hier een spatie wijzigt en vergeet de hash bij te
         werken: stil, en pas zichtbaar in productie. defer houdt het uit de weg van het
         tekenen en draait nog ruim voor het load-moment waar het op wacht. -->
    <script src="mirror.js" defer></script>
</body>
</html>
